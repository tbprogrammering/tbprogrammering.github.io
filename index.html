<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storhetstränaren</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="status-bar">
            <div class="status-left">
                <h1>Storhetstränaren</h1>
            </div>
            <div class="status-right">
                <div id="current-level-display"></div>
                <div id="progress-display"></div>
            </div>
        </div>

        <div class="input-group">
            <label>Storhet:</label>
            <input type="text" id="input-storhet">
        </div>

        <div class="input-group">
            <label>Beteckning (storhet):</label>
            <div class="rel-container">
                <div id="input-b-storhet" class="editable-input" contenteditable="true"></div>
                <button class="clear-input-btn hidden" data-target="input-b-storhet">✕</button>
            </div>
            <div id="symbol-helper-b-storhet" class="symbol-container"></div>
        </div>

        <div class="input-group">
            <label>Enhet:</label>
            <input type="text" id="input-enhet">
        </div>

        <div class="input-group">
            <label>Beteckning (enhet):</label>
            <div class="rel-container">
                <div id="input-b-enhet" class="editable-input" contenteditable="true"></div>
                <button class="clear-input-btn hidden" data-target="input-b-enhet">✕</button>
            </div>
            <div id="symbol-helper-b-enhet" class="symbol-container"></div>
        </div>
        
        <div class="button-container">
            <button id="check-btn" class="primary-btn">Kontrollera svar</button>
            <button id="next-btn" class="primary-btn hidden">Nästa fråga</button>
            <button id="skip-btn" class="secondary-btn">Hoppa över / Visa svar</button>
        </div>

        <button id="reset-progress">Nollställ alla framsteg</button>

        <div id="feedback" class="feedback hidden"></div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
